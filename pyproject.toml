[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moodle-mcp"
version = "0.1.0"
description = "MCP server that pulls courses, materials and deadlines from a Moodle site (LSE by default)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2",  # FastMCP API; mcp 2.x renamed it
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
moodle-mcp = "moodle_mcp.cli:main"

[tool.setuptools]
packages = ["moodle_mcp"]
