[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moodle-mcp"
version = "0.3.0"
description = "MCP server that pulls courses, materials, deadlines and lecture slides from Moodle (LSE by default)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2",  # FastMCP API; mcp 2.x renamed it
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
]

[project.urls]
Homepage = "https://github.com/Mattlo0546/moodle-mcp"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
moodle-mcp = "moodle_mcp.cli:main"

[tool.setuptools]
packages = ["moodle_mcp"]
